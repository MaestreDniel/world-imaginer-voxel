name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs: `changes` decides the docs-only fast path, the unit shards and the metrics-fast and metrics-quick shards;
# `check` (build, arch, integration), the `unit` shards, the `metrics-fast` shards and the `metrics-quick` shards run in
# parallel after it; `ci-ok` is the one status to require. Every vitest job writes a JSON report and lists its slowest
# files in the job summary.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      shards: ${{ steps.shards.outputs.shards }}
      fast_shards: ${{ steps.fast_shards.outputs.fast_shards }}
      unit_shards: ${{ steps.unit_shards.outputs.unit_shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node .github/scripts/changes.mjs --self-test
      # Docs only (docs/**, *.md at any depth, nothing else) against the PR base or the push's `before`; a new
      # branch, a force push or any doubt runs the full path.
      - id: changes
        run: node .github/scripts/changes.mjs
        env:
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
      - id: shards
        run: echo "shards=$(node .github/scripts/metricShards.mjs matrix)" >> "$GITHUB_OUTPUT"
      - id: fast_shards
        run: echo "fast_shards=$(node .github/scripts/fastShards.mjs matrix)" >> "$GITHUB_OUTPUT"
      - id: unit_shards
        run: echo "unit_shards=$(node .github/scripts/unitShards.mjs matrix)" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The docs-only path runs arch (its master spec, governance and threshold-log tests read the docs) and skips
      # integration; the unit shards run on both paths, because uiSmoke.test.ts and reviewSlices.test.ts read files
      # under docs/.
      - name: vitest arch and integration
        run: |
          projects="--project arch"
          if [ "$DOCS_ONLY" != true ]; then projects="$projects --project integration"; fi
          npx vitest run $projects --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest.json"
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          GOVERNANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - if: ${{ !cancelled() }}
        run: node .github/scripts/slowest.mjs --title "Slowest test files (check)" "$RUNNER_TEMP/vitest.json"

  # The unit project split by .github/scripts/unitShards.mjs (SP4b spec §1.2): named heavy files in `heavy` plus the
  # catch-all `rest`, so a new unit file always runs; its `check` fails the job unless the shards cover the project's
  # files exactly once. On both paths; no build (vitest transpiles; the typecheck stays in `check`) and no cache (only
  # the metrics jobs cache).
  unit:
    needs: changes
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit_shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node .github/scripts/unitShards.mjs check
      - run: node .github/scripts/unitShards.mjs run "$SHARD" "$RUNNER_TEMP/vitest.json"
        env:
          SHARD: ${{ matrix.shard }}
      - if: ${{ !cancelled() }}
        run: node .github/scripts/slowest.mjs --title "Slowest test files (unit $SHARD)" "$RUNNER_TEMP/vitest.json"
        env:
          SHARD: ${{ matrix.shard }}

  # metrics-fast split by .github/scripts/fastShards.mjs (SP4b spec §9's lever, taken after SP4c's merge run): `terrain`
  # and `surface` each in a shard of its own plus the catch-all `rest`, so a new metric file always runs; its `check`
  # fails the job unless the shards cover the project's files exactly once.
  metrics-fast:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: metrics-fast (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.fast_shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node .github/scripts/fastShards.mjs check
      # The region cache (SP3b spec §7): dumps only, never the bundled workers (test/.cache/taskHandler* etc.). The key
      # covers everything a dump's srcKey hashes; no restore-keys, so a code change starts cold instead of restoring
      # dumps that can never hit. Each metrics job (every metrics-fast shard, every metrics-quick shard) has its own key
      # suffix, so each restores and saves only the dumps of its own tier and files.
      - uses: actions/cache@v6
        with:
          path: test/.cache/regions
          key: regions-${{ runner.os }}-metrics-fast-${{ matrix.shard }}-${{ hashFiles('src/**', 'test/harness/**', 'package-lock.json') }}
      - run: node .github/scripts/fastShards.mjs run "$SHARD" "$RUNNER_TEMP/vitest.json"
        env:
          SHARD: ${{ matrix.shard }}
      - if: ${{ !cancelled() }}
        run: node .github/scripts/slowest.mjs --title "Slowest test files (metrics-fast $SHARD)" "$RUNNER_TEMP/vitest.json"
        env:
          SHARD: ${{ matrix.shard }}

  # metrics-quick split by .github/scripts/metricShards.mjs: named heavy files in their own shards plus a catch-all
  # shard that excludes them, so a new metric file always runs; its `check` fails the job unless the shards cover the
  # project's files exactly once.
  metrics-quick:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: metrics-quick (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node .github/scripts/metricShards.mjs check
      # The region cache: see metrics-fast (dumps only, no restore-keys, a key per job).
      - uses: actions/cache@v6
        with:
          path: test/.cache/regions
          key: regions-${{ runner.os }}-metrics-quick-${{ matrix.shard }}-${{ hashFiles('src/**', 'test/harness/**', 'package-lock.json') }}
      - run: node .github/scripts/metricShards.mjs run "$SHARD" "$RUNNER_TEMP/vitest.json"
        env:
          SHARD: ${{ matrix.shard }}
      - if: ${{ !cancelled() }}
        run: node .github/scripts/slowest.mjs --title "Slowest test files (metrics-quick $SHARD)" "$RUNNER_TEMP/vitest.json"
        env:
          SHARD: ${{ matrix.shard }}

  # The status to require: every job green, except that the docs-only path skips the metrics jobs. A matrix job's result
  # is its shards' aggregate: success only when every shard succeeded.
  ci-ok:
    needs: [changes, check, unit, metrics-fast, metrics-quick]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "docs_only=$DOCS_ONLY changes=$CHANGES check=$CHECK unit=$UNIT metrics-fast=$FAST metrics-quick=$QUICK"
          [ "$CHANGES" = success ] || { echo "::error::changes: $CHANGES"; exit 1; }
          [ "$CHECK" = success ] || { echo "::error::check: $CHECK"; exit 1; }
          [ "$UNIT" = success ] || { echo "::error::unit: $UNIT"; exit 1; }
          if [ "$DOCS_ONLY" = true ]; then want=skipped; else want=success; fi
          [ "$FAST" = "$want" ] || { echo "::error::metrics-fast: $FAST (want $want)"; exit 1; }
          [ "$QUICK" = "$want" ] || { echo "::error::metrics-quick: $QUICK (want $want)"; exit 1; }
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          UNIT: ${{ needs.unit.result }}
          FAST: ${{ needs.metrics-fast.result }}
          QUICK: ${{ needs.metrics-quick.result }}
